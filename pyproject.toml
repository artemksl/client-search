[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeup-client-search"
version = "0.1.0"
description = "Local city clinic research and AI visibility panel"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpcore>=1.0,<2.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "playwright>=1.40,<2",
    "pypdf>=5.0",
    "psutil>=7,<8",
    "tiktoken>=0.7,<1",
    "visibility-runner[desktop]==0.2.54",
    "workspace-automation-core==0.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
client-search = "client_search.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinic_geo.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.txt"]
"clinic_geo.outreach.migrations" = ["*.sql"]
"clinic_geo.outreach.wp2_migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
